[workspace]
resolver = "3"
members = [
    "crates/apricorn-core",
    "crates/apricorn-tools",
    "crates/apricorn-harness",
    "crates/apricorn-desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/example/apricorn"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.dependencies]
# Workspace-internal crates
apricorn-core = { path = "crates/apricorn-core" }

[profile.release]
lto = "thin"
codegen-units = 1